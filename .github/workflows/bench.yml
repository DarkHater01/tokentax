name: weekly-bench

# Regenerates data/ every Monday. Requires the OPENROUTER_API_KEY secret;
# without it the job exits cleanly so the schedule does not turn the repo red.
# Long free-tier runs are checkpointed every 2 minutes so a stall loses nothing.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run benchmark (checkpointed)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OPENROUTER_API_KEY secret not set; skipping the live run."
            exit 0
          fi
          git config user.name "tokentax-bot"
          git config user.email "actions@users.noreply.github.com"
          node runner/run.js &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 120
            git add data/
            git diff --cached --quiet || {
              git commit -m "chore: bench checkpoint"
              git pull --rebase origin main
              git push -q
            }
          done
          wait "$pid" || echo "run.js exited nonzero; scoring whatever completed"
          node runner/score.js || TOKENTAX_PARTIAL=1 node runner/score.js
          git add data/
          git diff --cached --quiet || git commit -m "chore: benchmark results"
          git pull --rebase origin main
          git push
