name: weekly-bench

# Regenerates data/ every Monday. Needs the secret for the provider named in
# runner/config.json (currently GROQ_API_KEY); without it the job exits cleanly
# so the schedule does not turn the repo red. Long free-tier runs are
# checkpointed every 10 minutes so a stall loses little without burying main
# under bot commits.
#
# Manual runs: mode=smoke (1 model, 1 task, prints results, commits nothing)
#              mode=full  (the weekly leaderboard)
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
    inputs:
      mode:
        description: "smoke = verify the live path (1 run per harness); harness = score the harness axis on one task; full = weekly leaderboard"
        type: choice
        options: [full, harness, smoke]
        default: full

permissions:
  contents: write

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run benchmark
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          # The provider is read from config, so the guard is too.
          KEYENV=$(node -p "require('./runner/providers.json')[require('./runner/config.json').provider||'openrouter'].keyEnv")
          if [ -z "${!KEYENV}" ]; then
            echo "$KEYENV secret not set; skipping the live run."
            exit 0
          fi

          if [ "$MODE" = "smoke" ]; then
            echo "SMOKE: $KEYENV, one model, one task, both variants, every harness."
            k="${!KEYENV}"
            echo "len=${#k}"
            if printf '%s' "$k" | grep -qE '^[A-Za-z0-9_.-]+$'; then echo "charset=OK"; else echo "charset=HAS-WHITESPACE-OR-QUOTES"; fi
            curl -s -o /tmp/models.json -w "provider /models -> HTTP %{http_code}\n" \
              "$(node -p "require('./runner/providers.json')[require('./runner/config.json').provider||'openrouter'].base")/models" \
              -H "Authorization: Bearer $k"
            echo "body: $(head -c 200 /tmp/models.json)"
            # Free tiers retire model ids without notice; print what actually exists
            # so a stale id in config.json is visible instead of a mystery 400.
            node -e "try{const j=require('/tmp/models.json');console.log('models: '+j.data.map(m=>m.id).join(', '))}catch(e){console.log('models: (could not parse)')}"
            export TOKENTAX_CONFIG=runner/config.smoke.json
            export TOKENTAX_TASKS=01-fix-failing-test
            export TOKENTAX_RAW=data/raw.smoke.json
            export TOKENTAX_OUT=data/results.smoke.json
            node runner/run.js
            # A smoke that loses one harness to a provider hiccup should still print
            # what it got: PARTIAL keeps the groups that did score.
            node runner/score.js || TOKENTAX_PARTIAL=1 node runner/score.js
            echo "--- smoke results ---"
            cat data/results.smoke.json
            exit 0
          fi

          if [ "$MODE" = "harness" ]; then
            # The harness axis on its own budget: both harnesses, one model, one task,
            # full reps, into its own raw/results files and its own README block. The
            # rows are not comparable with the 5-task leaderboard, which is exactly why
            # they are rendered separately instead of mixed in.
            export TOKENTAX_CONFIG=runner/config.harness.json
            export TOKENTAX_TASKS=01-fix-failing-test
            export TOKENTAX_RAW=data/raw.harness.json
            export TOKENTAX_OUT=data/results.harness.json
            node runner/run.js
            node runner/score.js || TOKENTAX_PARTIAL=1 node runner/score.js
            TOKENTAX_LB_MARKER=HARNESS node runner/leaderboard.js data/results.harness.json
            git config user.name "tokentax-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/ README.md
            git diff --cached --quiet || git commit -m "chore: harness-axis results"
            git pull --rebase origin main
            git push
            exit 0
          fi

          git config user.name "tokentax-bot"
          git config user.email "actions@users.noreply.github.com"
          node runner/run.js &
          pid=$!
          while kill -0 "$pid" 2>/dev/null; do
            sleep 600
            git add data/
            git diff --cached --quiet || {
              git commit -m "chore: bench checkpoint"
              git pull --rebase origin main
              git push -q
            }
          done
          wait "$pid" || echo "run.js exited nonzero; scoring whatever completed"
          node runner/score.js || TOKENTAX_PARTIAL=1 node runner/score.js
          node runner/leaderboard.js
          node runner/badge.js || echo "badge: skipped (nothing scored); publishing the table anyway"
          git add data/ README.md docs/badge.json
          git diff --cached --quiet || git commit -m "chore: benchmark results"
          git pull --rebase origin main
          git push
